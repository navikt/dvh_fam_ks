version: 2

sources:
  - name: dt_person
    schema: dt_person
    tables:
      - name: ident_off_id_til_fk_person1
      - name: dim_person

  - name: kode_verk
    schema: dt_kodeverk
    tables:
      - name: dim_tid_mnd
      - name: dim_tid
      - name: dim_alder
      - name: dim_geografi
      - name: dim_kjonn

  - name: fam_ks
    schema: dvh_fam_ks
    tables:
      - name: fam_ks_meta_data
        description: 'inneholder meta_data for kontantstøtte'
      - name: fam_ks_utbet_det
      - name: fam_ks_utbetaling
      - name: fam_ks_fagsak
      - name: vfam_ks_fagsak_siste
      - name: fam_ks_kompetanse_perioder
      - name: barnehage_hjelpetabell
      - name: fam_ks_vilkaar_resultat
      - name: FAK_KS_MOTTAKER
      - name: fak_ks_mottaker_infotrygd

models:
  # 🔷 Parent model
  - name: fam_ks_fagsak
    columns:
      - name: PK_KS_FAGSAK
        tests:
          - not_null
          - unique

  # 🔷 Child model
  - name: fam_ks_vilkaar_resultat
    columns:

      # ✅ Child primary key
      - name: PK_KS_VILKAAR_RESULTAT
        tests:
          - not_null
          - unique

      # ✅ Foreign key
      - name: FK_KS_FAGSAK
        tests:
          - not_null
          - relationships:
              to: ref('fam_ks_fagsak')
              field: PK_KS_FAGSAK

  # 🔷 Child og Parent model
  - name: fam_ks_kompetanse_perioder
    columns:
      - name: PK_KS_KOMPETANSE_PERIODER
        tests:
          - not_null
          - unique
      - name: FK_KS_FAGSAK
        tests:
          - not_null

          # ✅ THIS IS THE FOREIGN KEY
          - relationships:
              to: ref('fam_ks_fagsak')
              field: PK_KS_FAGSAK
            
  - name: fam_ks_kompetanse_barn
    columns:
      - name: PK_KS_KOMPETANSE_BARN  
        tests:
          - not_null
          - unique    
      - name: FK_KS_KOMPETANSE_PERIODER
        tests:
          - not_null

          # ✅ THIS IS THE FOREIGN KEY
          - relationships:
              to: ref('fam_ks_kompetanse_perioder')
              field: PK_KS_KOMPETANSE_PERIODER

  - name: fam_ks_utbetaling
    columns:
      - name: PK_KS_UTBETALING 
        tests:
          - not_null
          - unique
      - name: FK_KS_FAGSAK
        tests:
          - not_null

          # ✅ THIS IS THE FOREIGN KEY
          - relationships:
              to: ref('fam_ks_fagsak')
              field: PK_KS_FAGSAK

  - name: fam_ks_utbet_det
    columns:
      - name: PK_KS_UTBET_DET
        tests:
          - not_null
          - unique    
      - name: FK_KS_UTBETALING
        tests:
          - not_null

          # ✅ THIS IS THE FOREIGN KEY
          - relationships:
              to: ref('fam_ks_utbetaling')
              field: PK_KS_UTBETALING